<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Verify Your Email Address</title>
</head>
<body>
    <p>Hi {{ user.first_name or user.username }},</p>
    <p>Thank you for registering. Please click the link below to verify your email address and complete your registration:</p>
<p><a href="{{ url_for('verify_email', token=token, _external=True) }}">Verify Email Address</a></p>
    <p>If you did not register for this account, please ignore this email.</p>
    <p>Best regards,<br/>The MFA Demo Team</p>
</body>
</html>
